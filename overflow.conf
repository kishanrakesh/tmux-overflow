# Brace blocks must be parsed by source-file, rather than passed as shell arguments.
bind -n WheelUpPane if -F '#{@overflow_of}' { run -C 'copy-mode -e -t #{@overflow_of} ; send -t #{@overflow_of} -X -N 3 scroll-up' } { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -e } }
bind -n WheelDownPane if -F '#{@overflow_of}' { run -C 'send -t #{@overflow_of} -X -N 3 scroll-down' } { send -M }
